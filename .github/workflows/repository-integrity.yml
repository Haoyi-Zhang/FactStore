name: Repository integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '34'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded data reconstruction and evidence-admission checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: '.'
          P021_LOGS: ${{ runner.temp }}/p021-validation
        shell: bash
        run: |
          mkdir -p "$P021_LOGS"
          set +e
          timeout --signal=TERM --kill-after=5s 180s bash -c '
            set -e
            python .github/scripts/check_repository.py > "$P021_LOGS/integrity.stdout.txt" 2> "$P021_LOGS/integrity.stderr.txt"
            python -m unittest tests.test_evidence_admission tests.test_journal_evidence tests.test_sql_integer_domain tests.test_exhaustive -v > "$P021_LOGS/tests.stdout.txt" 2> "$P021_LOGS/tests.stderr.txt"
            python -m experiments.verify_checked_results --results results > "$P021_LOGS/historical.stdout.txt" 2> "$P021_LOGS/historical.stderr.txt"
            python -m experiments.verify_artifact > "$P021_LOGS/package.stdout.txt" 2> "$P021_LOGS/package.stderr.txt"
            python -m experiments.verify_publication_references > "$P021_LOGS/references.stdout.txt" 2> "$P021_LOGS/references.stderr.txt"
          ' > "$P021_LOGS/campaign.stdout.txt" 2> "$P021_LOGS/campaign.stderr.txt"
          code=$?
          printf 'scope=data-only reconstruction, finite model and in-memory/preflight regression checks; no engine benchmarks\nwall_limit_seconds=180\nexit_code=%s\n' "$code" > "$P021_LOGS/campaign.txt"
          exit "$code"
      - name: Retain raw validation logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p021-data-validation-logs
          path: ${{ runner.temp }}/p021-validation
          if-no-files-found: warn
